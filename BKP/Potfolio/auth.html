<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in or sign up — TenaWork</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="nav">
  <a href="index.html" class="brand-link" aria-label="TenaWork — home">
    <svg class="brand-logo" viewBox="0 0 176 30" xmlns="http://www.w3.org/2000/svg">
      <text x="0" y="22" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="23">
        <tspan fill="#14171f">tena</tspan><tspan fill="#e2472b">work</tspan>
      </text>
    </svg>
  </a>
  <a class="navlink" href="index.html">← back</a>
</div>

<div class="wrap auth-wrap">

  <div class="auth-toggle">
    <button class="toggle-btn active" id="tabLogin" onclick="showAuth('login')">Log in</button>
    <button class="toggle-btn" id="tabSignup" onclick="showAuth('signup')">Sign up</button>
  </div>

  <!-- LOGIN -->
  <div id="loginPane">
    <h2 style="font-size:24px;margin-top:26px;">Welcome back</h2>
    <p style="color:var(--muted);margin-top:6px;font-size:14px;">Log in to update your profile or check your stats.</p>
    <div class="panel" style="padding:32px;margin-top:20px;">
      <div class="field">
        <label>Phone number or email</label>
        <input type="text" placeholder="07XX XXX XXX">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" placeholder="••••••••">
      </div>
      <button class="btn btn-accent" style="width:100%;justify-content:center;padding:14px;" onclick="window.location.href='dashboard.html'">Log in</button>
      <div style="text-align:center;margin-top:16px;"><a class="navlink" href="#" style="margin:0;font-size:13px;">Forgot password?</a></div>
    </div>
  </div>

  <!-- SIGNUP -->
  <div id="signupPane" style="display:none;">

    <div id="step2">
      <h2 style="font-size:24px;margin-top:26px;">Create your account</h2>
      <p style="color:var(--muted);margin-top:6px;font-size:14px;">One profile does it all — build your CV, upload documents, and browse others once you're in.</p>
      <div class="panel" style="margin-top:20px;padding:32px;">
        <div class="field">
          <label>Full name</label>
          <input type="text" placeholder="e.g. Amina Wanjiru">
        </div>
        <div class="field">
          <label>Phone number (M-Pesa)</label>
          <input type="tel" placeholder="07XX XXX XXX">
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="pw1" placeholder="••••••••" oninput="checkMatch()">
        </div>
        <div class="field">
          <label>Confirm password</label>
          <input type="password" id="pw2" placeholder="••••••••" oninput="checkMatch()">
          <div id="matchMsg" style="font-size:12.5px;margin-top:6px;height:14px;"></div>
        </div>
        <button class="btn btn-accent" style="width:100%;justify-content:center;padding:14px;" onclick="submitSignup()">Create my profile</button>
      </div>
    </div>
  </div>

</div>

<footer class="foot">Free to join · upgrade any time for KSh 200/month</footer>

<style>
.auth-wrap{max-width:520px;padding-top:50px;padding-bottom:80px;}
.auth-toggle{display:flex;border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;}
.toggle-btn{flex:1;padding:10px;border:none;background:transparent;border-radius:8px;font-family:'Inter';font-weight:600;font-size:14px;cursor:pointer;color:var(--muted);}
.toggle-btn.active{background:var(--ink);color:#fff;}
@media(max-width:600px){
  .auth-wrap{padding-top:30px;padding-bottom:50px;}
  #loginPane .panel,#signupPane .panel{padding:22px;}
}
</style>

<script>
function showAuth(which){
  document.getElementById('loginPane').style.display = which==='login' ? 'block':'none';
  document.getElementById('signupPane').style.display = which==='signup' ? 'block':'none';
  document.getElementById('tabLogin').classList.toggle('active', which==='login');
  document.getElementById('tabSignup').classList.toggle('active', which==='signup');
}
let selected = null;
function pick(el, role){
  document.querySelectorAll('.role-card').forEach(c=>c.classList.remove('selected'));
  el.classList.add('selected');
  selected = role;
}
function goStep2(){
  if(!selected){ alert('Choose a role to continue'); return; }
  document.getElementById('step1').style.display='none';
  document.getElementById('step2').style.display='block';
  document.getElementById('dot2').classList.add('done');
}
function checkMatch(){
  const p1=document.getElementById('pw1').value, p2=document.getElementById('pw2').value;
  const msg=document.getElementById('matchMsg');
  if(!p2){ msg.textContent=''; return; }
  if(p1===p2){ msg.textContent='Passwords match'; msg.style.color='var(--green)'; }
  else { msg.textContent='Passwords do not match'; msg.style.color='var(--red)'; }
}
function submitSignup(){
  const p1=document.getElementById('pw1').value, p2=document.getElementById('pw2').value;
  if(p1!==p2 || !p1){ alert('Passwords must match and cannot be empty'); return; }
  window.location.href='dashboard.html';
}
</script>

</body>
</html>
